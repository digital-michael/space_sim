syntax = "proto3";

// Package spacesim.v1 is the public contract for the Space Sim server.
// This file extends the service set with session identity management (F-020).
package spacesim.v1;

option go_package = "github.com/digital-michael/space_sim/api/gen/spacesim/v1;spacesimv1";

// ─── SessionService ───────────────────────────────────────────────────────────
//
// Session identity and registration for connected clients (F-020).
// Each client registers on connect and receives a server-assigned SessionID,
// Color, and (possibly downgraded) Role.
service SessionService {
  // RegisterClient creates a new session.
  rpc RegisterClient(RegisterClientRequest) returns (RegisterClientResponse);

  // UnregisterClient removes a session and releases its color slot.
  // Clients should call this before disconnecting for clean shutdown.
  rpc UnregisterClient(UnregisterClientRequest) returns (UnregisterClientResponse);

  // ListSessions returns all currently registered sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // UpdatePosition stores the client's last-known world position in the registry.
  rpc UpdatePosition(UpdatePositionRequest) returns (UpdatePositionResponse);

  // UpdatePOV stores the client's last-known point-of-view direction.
  rpc UpdatePOV(UpdatePOVRequest) returns (UpdatePOVResponse);

  // SessionStream is a bidirectional streaming RPC. The client continuously
  // sends ClientUpdate messages (position + POV); the server replies with
  // SessionDelta messages describing session changes (add/update/remove).
  rpc SessionStream(stream ClientUpdate) returns (stream SessionDelta);

  // KickClient removes a session from the registry (admin only).
  // The calling client must have CLIENT_ROLE_ADMIN.
  rpc KickClient(KickClientRequest) returns (KickClientResponse);

  // TeleportClient sets a session's world position (admin only).
  // The calling client must have CLIENT_ROLE_ADMIN.
  rpc TeleportClient(TeleportClientRequest) returns (TeleportClientResponse);
}

// ─── ClientRole ───────────────────────────────────────────────────────────────

// ClientRole classifies the access level of a connected client.
enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_PLAYER      = 1; // Default for connected human clients.
  CLIENT_ROLE_NPC         = 2; // Reserved for server-managed automated clients.
  CLIENT_ROLE_ADMIN       = 3; // Elevated access; requires admin_secret.
  CLIENT_ROLE_OTHER       = 4; // Catch-all for future extension.
}

// ─── RegisterClient ───────────────────────────────────────────────────────────

message RegisterClientRequest {
  uint32     version      = 1;
  string     client_uuid  = 2; // Client-generated UUID v4; stable across reconnects.
  string     label        = 3; // Display name; max 32 UTF-8 chars; server truncates.
  ClientRole role         = 4; // Requested role; server may downgrade to PLAYER.
  string     admin_secret = 5; // Required when requesting CLIENT_ROLE_ADMIN.
}

message RegisterClientResponse {
  uint32     version    = 1;
  string     session_id = 2; // Server-assigned UUID for this session.
  ClientRole role       = 3; // Actual assigned role; may differ from requested.
  bytes      color_rgb  = 4; // 3-byte RGB color assigned by server (r, g, b).
}

// ─── UnregisterClient ─────────────────────────────────────────────────────────

message UnregisterClientRequest {
  uint32 version    = 1;
  string session_id = 2;
}

message UnregisterClientResponse {
  uint32 version = 1;
}

// ─── ListSessions ─────────────────────────────────────────────────────────────

message ListSessionsRequest {
  uint32 version = 1;
}

// ClientSessionInfo carries the public fields of a registered session.
message ClientSessionInfo {
  uint32     version    = 1;
  string     session_id = 2;
  string     label      = 3;
  ClientRole role       = 4;
  bytes      color_rgb  = 5; // 3-byte RGB (r, g, b).
  // Phase 2: last-known world position (AU-scale).
  double     pos_x      = 6;
  double     pos_y      = 7;
  double     pos_z      = 8;
  // Phase 2: last-known point-of-view direction (unit vector).
  float      pov_x      = 9;
  float      pov_y      = 10;
  float      pov_z      = 11;
}

message ListSessionsResponse {
  uint32                     version  = 1;
  repeated ClientSessionInfo sessions = 2;
}

// ─── UpdatePosition ───────────────────────────────────────────────────────────

message UpdatePositionRequest {
  uint32 version    = 1;
  string session_id = 2;
  double pos_x      = 3;
  double pos_y      = 4;
  double pos_z      = 5;
}

message UpdatePositionResponse {
  uint32 version = 1;
}

// ─── UpdatePOV ────────────────────────────────────────────────────────────────

message UpdatePOVRequest {
  uint32 version    = 1;
  string session_id = 2;
  float  pov_x      = 3;
  float  pov_y      = 4;
  float  pov_z      = 5;
}

message UpdatePOVResponse {
  uint32 version = 1;
}

// ─── SessionStream ────────────────────────────────────────────────────────────

// ChangeType classifies a session change event.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_ADD         = 1;
  CHANGE_TYPE_UPDATE      = 2;
  CHANGE_TYPE_REMOVE      = 3;
}

// ClientUpdate is sent by a client over SessionStream to report its current
// world position and view direction.
message ClientUpdate {
  uint32 version    = 1;
  string session_id = 2;
  double pos_x      = 3;
  double pos_y      = 4;
  double pos_z      = 5;
  float  pov_x      = 6;
  float  pov_y      = 7;
  float  pov_z      = 8;
}

// SessionDelta carries a single session change event pushed by the server over
// SessionStream. session is populated for ADD and UPDATE; for REMOVE only
// session_id is set.
message SessionDelta {
  uint32            version     = 1;
  ChangeType        change_type = 2;
  ClientSessionInfo session     = 3;
}

// ─── KickClient ───────────────────────────────────────────────────────────────

// KickClientRequest removes target_session_id from the registry.
// admin_session_id must belong to a CLIENT_ROLE_ADMIN session.
message KickClientRequest {
  uint32 version           = 1;
  string admin_session_id  = 2;
  string target_session_id = 3;
}

message KickClientResponse {
  uint32 version = 1;
}

// ─── TeleportClient ───────────────────────────────────────────────────────────

// TeleportClientRequest moves target_session_id to the given world position.
// admin_session_id must belong to a CLIENT_ROLE_ADMIN session.
message TeleportClientRequest {
  uint32 version           = 1;
  string admin_session_id  = 2;
  string target_session_id = 3;
  double pos_x             = 4;
  double pos_y             = 5;
  double pos_z             = 6;
}

message TeleportClientResponse {
  uint32 version = 1;
}
